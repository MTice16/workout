<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="mobile-web-app-capable" content="yes">
<title>Workout Tracker</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#151922; --panel2:#1c222e; --line:#262d3a;
    --text:#eef2f7; --muted:#9aa6b8; --accent:#4f8cff; --accent2:#38d39f;
    --warn:#ffb454; --chip:#222a38; --danger:#ff5d6c;
    --radius:16px; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    line-height:1.4;
  }
  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(11,13,18,.92);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;
  }
  .titlerow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px;}
  .titlerow h1{font-size:16px; margin:0; letter-spacing:.3px;}
  .titlerow .sub{font-size:12px; color:var(--muted);}
  .weektoggle{display:flex; background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:3px;}
  .weektoggle button{
    border:0; background:transparent; color:var(--muted); font-weight:600;
    font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .weektoggle button.active{background:var(--accent); color:#fff;}
  .days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  .days::-webkit-scrollbar{display:none;}
  .days button{
    flex:0 0 auto; border:1px solid var(--line); background:var(--panel);
    color:var(--muted); font-size:13px; font-weight:600; padding:6px 12px;
    border-radius:12px; cursor:pointer; white-space:nowrap;
  }
  .days button.active{background:var(--panel2); color:var(--text); border-color:var(--accent);}
  .days button .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent2); margin-left:6px; vertical-align:middle;}
  /* ---------- content ---------- */
  main{max-width:640px; margin:0 auto; padding:8px 5px 12px;}
  .dayhead{margin:2px 2px 6px;}
  .dayhead-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .dayhead-l{min-width:0;}
  .dayhead h2{margin:0; font-size:15px;}
  .dayhead .tag{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .ssbtns{display:flex; gap:6px; flex:0 0 auto;}
  .ssmake{border:0; border-radius:9px; padding:7px 11px; font-size:12px; font-weight:700; background:var(--accent); color:#fff; cursor:pointer;}
  .ssmake:disabled{opacity:.4;}
  .rest{
    text-align:center; padding:60px 20px; color:var(--muted);
    background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius);
  }
  .rest .big{font-size:44px; margin-bottom:8px;}
  /* ---------- exercise card ---------- */
  .card{
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:11px; margin-bottom:5px; padding:6px 5px;
  }
  .card.sel{outline:2px solid var(--accent); outline-offset:-2px;}
  .ssgroup{
    border:1px solid var(--accent); border-radius:14px;
    padding:5px 3px; margin-bottom:8px; background:rgba(79,140,255,.05);
  }
  .ssgroup .sslabel{font-size:10px; font-weight:700; color:var(--accent); letter-spacing:1px; text-transform:uppercase; margin:2px 4px 6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ssgroup .card{margin-bottom:6px;}
  .ssgroup .card:last-child{margin-bottom:0;}
  /* superset editing */
  .ssedit-btn{flex:0 0 auto; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-size:12px; font-weight:700; padding:7px 11px; border-radius:10px; cursor:pointer;}
  .ssedit-btn.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .sshint{font-size:12px; color:var(--muted); background:var(--panel); border:1px dashed var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px; line-height:1.5;}
  .sscheck{position:absolute; top:8px; left:8px; z-index:6; width:32px; height:32px; border-radius:9px;
    background:rgba(11,13,18,.72); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; cursor:pointer;}
  .sscheck.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .ssungroup{margin-left:auto; background:rgba(255,93,108,.12); border:1px solid #5a2a30; color:#ff8a94; font-size:11px; font-weight:700; padding:5px 11px; border-radius:8px; cursor:pointer;}
  .ssungroup:active{background:rgba(255,93,108,.22);}
  .ssbar{position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:640px; margin:0 auto;
    background:rgba(21,25,34,.97); backdrop-filter:blur(8px); border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .ssbar span{font-size:13px; color:var(--muted); font-weight:600;}
  .ssbar .ssmake{border:0; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff;}
  .ssbar .ssmake:disabled{opacity:.4; cursor:default;}
  /* compact exercise row */
  .trow{display:flex; align-items:center; gap:7px; margin-bottom:4px;}
  .ordsel{flex:0 0 auto; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; font-size:13px; font-weight:800; padding:5px 3px; cursor:pointer; text-transform:none;}
  .extitle{flex:1; min-width:0; display:flex; align-items:center; gap:6px;
    background:transparent; border:0; color:var(--text); padding:0; cursor:pointer; text-align:left;}
  .extitle .tnm{flex:1; min-width:0; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .extitle .exicon{flex:0 0 auto; font-size:13px; opacity:.55;}
  .repsedit{flex:0 0 auto; background:var(--chip); color:var(--text); border:1px solid var(--line); text-transform:none;
    border-radius:7px; font-size:13px; font-weight:800; padding:4px 8px; cursor:pointer; white-space:nowrap;}
  .repsedit:active{background:var(--panel2);}
  .donebtn{flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:2px solid var(--line);
    background:transparent; color:#fff; font-size:15px; font-weight:900; cursor:pointer; line-height:1; padding:0;}
  .donebtn.on{background:var(--accent2); border-color:var(--accent2);}
  .card.done{opacity:.5;}
  .card.done .tnm{text-decoration:line-through;}
  .ssgroup.done{opacity:.6;}
  .sslabel-txt{white-space:nowrap;}
  .choice-card{max-width:400px;}
  .choice-list{display:flex; flex-direction:column; gap:8px; margin:4px 0 14px;}
  .choice-btn{width:100%; text-align:left; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:11px; padding:12px 14px; cursor:pointer;
    display:flex; flex-direction:column; gap:2px;}
  .choice-btn:active{background:#232b39;}
  .choice-btn b{font-size:16px;}
  .choice-sub{font-size:12px; font-weight:500; color:var(--muted);}
  .choice-cancel{width:100%; background:var(--chip); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:11px; font-size:14px; font-weight:700; cursor:pointer;}
  .boxes{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px;}
  .cell{display:flex; flex-direction:column; gap:1px;}
  .plab{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; text-align:center;}
  .plab.matthias{color:var(--accent2);}  /* green */
  .plab.nehemiah{color:var(--accent);}   /* blue  */
  .plab.hailey{color:var(--warn);}        /* yellow */
  .wbox{width:100%; text-align:center; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 4px; font-size:14px; font-weight:700;}
  .cell.matthias .wbox{border-color:#1f5546;}
  .cell.nehemiah .wbox{border-color:#31456e;}
  .cell.hailey  .wbox{border-color:#5a4620;}
  .wbox:focus{outline:2px solid var(--accent); border-color:transparent;}
  .wbox.okflash{border-color:var(--accent2); background:rgba(56,211,159,.14);}
  /* failure sets: [weight] × [reps] for set 1, and the rest of the sets under it */
  .boxes{grid-template-columns:repeat(3, minmax(0, 1fr));}
  .cell{min-width:0;}
  .fpair{display:flex; align-items:center; gap:1px; min-width:0;}
  .fpair .wbox{width:0; min-width:0; font-size:16px; padding:6px 2px;}
  .fpair .fw{flex:1 1 0;}
  .fpair .fr{flex:0 0 36%;}
  .fpair .fx{flex:0 0 auto; font-size:10px; font-weight:700; color:var(--muted);}
  .fpair .wbox::placeholder{color:#7f8aa0; font-weight:600;}
  .wbox.need{border-color:var(--danger) !important;}
  .plab.tap{cursor:pointer;}
  .wsub{font-size:10.5px; color:var(--muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:14px;}
  .wsub.then{color:var(--accent2); font-weight:700;}
  .wsub.need{color:#ff8a94; font-weight:700;}
  .rulebtn{flex:0 0 auto; width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--chip);
    color:var(--muted); font-size:13px; font-weight:800; padding:0; cursor:pointer; line-height:1;}
  .rulebtn.spot{color:var(--warn);}
  .rulebtn.off{opacity:.35;}
  .ssedit-btn.fire.on{color:var(--warn); border-color:#5a4620; background:rgba(255,180,84,.12);}
  /* sync status */
  .sync{display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:middle;
    background:var(--chip); color:var(--muted); border:1px solid var(--line);}
  .sync[hidden]{display:none;}
  .sync.wait{color:var(--warn); border-color:#5a4620;}
  .sync.err{color:var(--danger); border-color:#5a2a30;}
  /* pop-ups: log a failure set, exercise settings */
  .modal.top{align-items:flex-start; padding-top:calc(env(safe-area-inset-top) + 24px);}
  .pop-card{max-width:440px;}
  .modal-card.scroll{max-height:86vh; overflow-y:auto;}
  .pop-rule{font-size:12px; color:var(--muted); margin:-4px 4px 10px;}
  .pop-info{font-size:13px; margin:0 4px 12px; line-height:1.55;}
  .why{color:var(--muted); font-size:12px; font-weight:500;}
  .pop-fields{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 10px;}
  .pop-fields.one{grid-template-columns:1fr;}
  .pop-fields label{display:flex; flex-direction:column; gap:4px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .pop-fields input, .pop-fields select{width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:11px 10px; font-size:17px; font-weight:700; text-transform:none; letter-spacing:0;}
  .pop-fields input:focus{outline:2px solid var(--accent); border-color:transparent;}
  .pop-preview{font-size:13px; line-height:1.55; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:12px;}
  .pop-btns{display:flex; gap:8px;}
  .pop-btns .choice-cancel{flex:1;}
  .pop-save{flex:1; border:0; background:var(--accent); color:#fff; font-size:15px; font-weight:700; padding:12px; border-radius:10px; cursor:pointer;}
  .pop-undo{display:block; margin:12px auto 0; background:none; border:0; color:#ff8a94; font-size:12px; font-weight:700; cursor:pointer;}
  .sec{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:4px 4px 6px;}
  .opt-list{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .opt{text-align:left; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; cursor:pointer; font-size:14px; font-weight:700;}
  .opt.on{border-color:var(--accent); background:rgba(79,140,255,.14);}
  .opt span{display:block; font-size:11px; font-weight:500; color:var(--muted); margin-top:2px;}
  .sscheck-inline{flex:0 0 auto; width:40px; height:40px; border-radius:10px; background:var(--chip);
    border:1px solid var(--line); color:var(--text); display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; cursor:pointer;}
  .sscheck-inline.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  /* image modal */
  .modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:18px;}
  .modal[hidden]{display:none;}
  .modal-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.8);}
  .modal-card{position:relative; z-index:1; width:100%; max-width:520px; background:var(--panel);
    border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow);}
  .modal-x{position:absolute; top:10px; right:10px; width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:19px; font-weight:800; cursor:pointer; z-index:2;}
  .modal-x:active{background:#232b39;}
  .modal-title{font-size:18px; font-weight:800; padding:6px 48px 12px 4px;}
  .modal-imgwrap{background:#0f1219; border:1px solid var(--line); border-radius:12px; overflow:hidden;
    min-height:220px; display:flex; align-items:center; justify-content:center;}
  .modal-imgwrap img{width:100%; max-height:68vh; object-fit:contain; display:block;}
  .modal-ph{color:#5f6b7d; font-size:14px; font-weight:600; padding:70px 20px;}
  .imgbox{
    position:relative; width:100%; aspect-ratio:16/10; background:
      repeating-linear-gradient(45deg,#20262f,#20262f 12px,#232a34 12px,#232a34 24px);
    display:flex; align-items:center; justify-content:center;
    color:#5f6b7d; font-size:13px; font-weight:600; letter-spacing:.5px;
  }
  .imgbox img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#0f1219;}
  .body{padding:14px;}
  .exname{font-size:17px; font-weight:700; margin:0 0 8px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
  .chip{
    font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px;
    background:var(--chip); border:1px solid var(--line); color:var(--text);
  }
  .chip.reps{color:#cfe0ff; border-color:#31456e;}
  .chip.pct{color:var(--warn); border-color:#5a4620;}
  .chip.cur{color:var(--accent2); border-color:#1f5546;}
  .note{font-size:12px; color:var(--muted); margin:4px 0 0;}
  /* ---------- history ---------- */
  .hist{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px;}
  .hist .h-title{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:6px;}
  .hist .empty{font-size:12px; color:#5f6b7d; font-style:italic;}
  .logrow{
    display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 0;
    border-bottom:1px solid rgba(255,255,255,.03);
  }
  .logrow:last-child{border-bottom:0;}
  .logrow .who{font-weight:700; min-width:74px;}
  .logrow .who.matthias{color:var(--accent);}
  .logrow .who.nehemiah{color:var(--accent2);}
  .logrow .who.hailey{color:var(--warn);}
  .plan{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .pchip{font-size:12px; font-weight:700; padding:4px 9px; border-radius:8px; background:var(--chip); border:1px solid var(--line); color:var(--text);}
  .pchip.matthias{color:var(--accent); border-color:#31456e;}
  .pchip.nehemiah{color:var(--accent2); border-color:#1f5546;}
  .pchip.hailey{color:var(--warn); border-color:#5a4620;}
  .logrow .val{color:var(--text);}
  .logrow .when{margin-left:auto; color:#5f6b7d; font-size:11px;}
  .logrow .del{margin-left:6px; color:#5f6b7d; cursor:pointer; font-size:14px; padding:0 4px;}
  /* ---------- log form ---------- */
  .logform{margin-top:12px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px;}
  .logform .hdr{display:grid; grid-template-columns:110px 1fr; gap:8px; margin-bottom:6px; padding:0 2px;}
  .logform .hdr span{font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted);}
  .logform .hdr span:first-child{visibility:hidden;}
  .prow{display:grid; grid-template-columns:110px 1fr; gap:8px; align-items:center; margin-bottom:8px;}
  .prow .pname{font-size:14px; font-weight:700;}
  .prow .pname.matthias{color:var(--accent);}
  .prow .pname.nehemiah{color:var(--accent2);}
  .prow .pname.hailey{color:var(--warn);}
  .prow input{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:10px 8px; font-size:15px; font-weight:600;
  }
  .prow input::placeholder{color:#4d5666; font-weight:400;}
  .prow input:focus{outline:2px solid var(--accent); border-color:transparent;}
  .logbtn{
    margin-top:8px; width:100%; border:0; background:var(--accent); color:#fff;
    font-size:15px; font-weight:700; padding:12px; border-radius:10px; cursor:pointer;
  }
  .logbtn:active{transform:scale(.99); background:#3f78e6;}
  .logbtn.saved{background:var(--accent2);}
  footer{text-align:center; color:#4d5666; font-size:10px; padding:8px;}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <div>
      <h1>💪 Workout Tracker<span id="sync" class="sync" hidden></span></h1>
      <div class="sub" id="todaySub"></div>
    </div>
    <div class="weektoggle" id="weekToggle">
      <button data-week="1">Week 1</button>
      <button data-week="2">Week 2</button>
    </div>
  </div>
  <div class="days" id="dayNav"></div>
</header>
<main id="main"></main>
<footer>Saved on this phone first • uploads when you have signal</footer>

<div id="imgModal" class="modal" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-card">
    <button class="modal-x" id="modalX" aria-label="Close">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-imgwrap" id="modalImgWrap"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
/* ============================================================
   WORKOUT DATA
   img: relative path to a picture in "Images fro work outs".
        Missing files fall back to the gray placeholder.
   ============================================================ */
const IMG = "Images fro work outs/";
const DATA = {
  1: {
    1: { title:"Monday — Push", tag:"Iso Compound", ex:[
      {name:"Barbell Bench Press", reps:"4x6", pct:"75–80%", note:"+2x 35s", img:IMG+"Barbell Bench Press.webp"},
      {name:"Incline Dumbbell Press", reps:"4x6", pct:"70–75%", note:"+2x 20s", img:IMG+"Incline Dumbbell Press.webp"},
      {name:"Decline Barbell Press", reps:"3x8", pct:"70%", note:"+2x 25s", img:IMG+"Decline Barbell Press.webp"},
      {name:"Standing Barbell Overhead Press", reps:"4x6", pct:"70–75%", img:IMG+"Standing Barbell Overhead Press"},
      {name:"Dumbbell Arnold Press", reps:"3x8", pct:"70%", img:IMG+"Dumbbell Arnold Press.webp"},
      {name:"Barbell Upright Row", reps:"4x6", pct:"70%", note:"+2x 20s", img:IMG+"Barbell Upright Row.webp"},
      {name:"Close Grip Bench Press", reps:"3x8", pct:"70%", img:IMG+"Close Grip Bench Press.webp"},
      {name:"Weighted Dips", reps:"3x6–8", img:IMG+"Weighted Dips.avif"},
    ]},
    2: { title:"Tuesday — Pull", tag:"Iso Compound", ex:[
      {name:"Deadlift", reps:"4x5", pct:"80–85%", note:"2x 25lbs", img:IMG+"Deadlift.webp"},
      {name:"Barbell Bent Over Row", reps:"4x6", pct:"75%", note:"2x 25lbs", img:IMG+"Barbell Bent Over Row.webp"},
      {name:"Pull Ups", reps:"4x6", note:"M 40 · N 115", img:IMG+"Pull Ups.webp"},
      {name:"Barbell Curl", reps:"3x8", pct:"70%", note:"30lbs", img:IMG+"Barbell Curl.webp"},
      {name:"Hammer Curl (Dumbbell)", reps:"3x8–10", pct:"65%", note:"2x 22.5lbs", img:IMG+"Hammer Curl Dumbbell"},
      {name:"Barbell Wrist Curl", reps:"3x12–15", note:"30lbs", img:IMG+"Barbell Wrist Curl.png"},
    ]},
    3: { title:"Wednesday — Legs + Abs", tag:"Compound", ex:[

function parsePlan(note){
  const out = {people:{}, both:null, raw:null};
  if(!note) return out;
  if(/^\+/.test(note.trim())){ out.raw = note.replace(/^\+\s*/,""); return out; }
  note.split("·").map(s=>s.trim()).filter(Boolean).forEach(p=>{
    const m = p.match(/^([mnh])\s+(.+)$/i);
    if(m){ out.people[{m:"matthias",n:"nehemiah",h:"hailey"}[m[1].toLowerCase()]] = m[2].trim(); }
    else out.both = p;
  });
  if(out.both){ out.people.matthias = out.both; out.people.nehemiah = out.both; }
  return out;
}

function setIn(root, path, value){

    if(o[k] == null || typeof o[k] !== "object"){ if(value == null) return; o[k] = {}; }
    o = o[k];

  if(value == null) delete o[last]; else o[last] = clone(value);
}

function convertOldSS(old){
  const out = {};

    const day = SSDAY[String(dk).split("-")[1]];

    const v = old[dk];
    (Array.isArray(v) ? v : Object.values(v || {})).forEach(g0=>{
      if(!g0) return;
      const g = normGroup(g0);
      if(g.keys.length < 2) return;
      out[day] = out[day] || {};

      if(!cur){ out[day][g.id] = {keys: g.keys, t: idTime(g.id)}; if(g.sets) out[day][g.id].sets = g.sets; }
      else if(!cur.sets && g.sets) cur.sets = g.sets;
    });
  });
  return out;
}

// superset groups: each group is {id, keys:[...], sets}. Legacy groups were plain arrays.
function normGroup(g){
  // a group shares SETS across its exercises; each keeps its own reps.
  // legacy groups stored a full `reps` string — migrate its sets part.
  if(Array.isArray(g)){ const keys = g.slice(); return {id:"g:" + keys.slice().sort().join("|"), keys, sets:null}; }
  const keys = Array.isArray(g.keys) ? g.keys.slice() : Object.values(g.keys || {});
  const sets = (g.sets != null) ? g.sets : (g.reps ? splitSR(g.reps).sets : null);
  return {id: g.id || ("g:" + keys.slice().sort().join("|")), keys, sets: sets || null};
}
// supersets showing on one day. A superset shows whenever all of its exercises are on that
// day — in either week. If two overlap, the newest one wins (nothing gets deleted).
function groupsForDay(week, day){
  const present = new Set(DATA[week][day].ex.map(e=> exKey(e.name)));
  const all = Object.entries(STATE.ss2[SSDAY[day]] || {}).filter(([id, g])=> g).map(([id, g])=>({
    id, keys: (Array.isArray(g.keys) ? g.keys : Object.values(g.keys || {})).filter(Boolean), sets: g.sets || null, t: +g.t || 0
  }));
  const cands = all.filter(g=> g.keys.length >= 2 && g.keys.every(k=> present.has(k)));
  cands.sort((a, b)=> (b.t - a.t) || (a.id < b.id ? -1 : 1));
  const claimed = new Set(), shown = [];
  cands.forEach(g=>{
    if(g.keys.some(k=> claimed.has(k))) return;
    g.keys.forEach(k=> claimed.add(k));
    shown.push(g);
  });
  return shown;
}

function todayStr(d){

  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function isToday(ts){ return todayStr(new Date(ts)) === todayStr(); }
// Week rotation anchored so the week of Mon 2026-08-31 = Week 2, then alternating.
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const g = x.getDay();
  x.setDate(x.getDate() + (g===0 ? -6 : 1-g));  // back up to this week's Monday
  return x;
}
const ANCHOR = mondayOf(new Date(2026, 7, 31));  // Aug 31 2026 → Week 2
function weekOf(d){ const w = Math.round((mondayOf(d) - ANCHOR) / (7*86400000)); return (((w % 2) + 2) % 2) === 0 ? 2 : 1; }
let TODAY = null;
function computeToday(){
  const n = new Date(), js = n.getDay();                // 0=Sun..6=Sat
  TODAY = {date: todayStr(n), week: weekOf(n), day: (js >= 1 && js <= 5) ? js : null};
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c=> ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c])); }
function fmtDate(ts){
  const d = new Date(ts), n = new Date();
  const days = Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(days===0) return "today";
  if(days===1) return "yesterday";
  if(days<7) return days+"d ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function fmtW(v){

// the last number in a string: "135" → 135, "2x 35lbs" → 35, "M 25s" → 25
function num(v){ const m = String(v == null ? "" : v).match(/\d+(\.\d+)?|\.\d+/g); return m ? parseFloat(m[m.length - 1]) : NaN; }
// split "4x6" -> {sets:"4", reps:"6"}; "3x to failure" -> {sets:"3", reps:"to failure"}
function splitSR(str){
  str = String(str==null?"":str).trim();
  const i = str.toLowerCase().indexOf("x");
  if(i < 0) return {sets:str, reps:""};
  return {sets: str.slice(0,i).trim(), reps: str.slice(i+1).trim()};
}

function targetOf(str){

  const T = m ? (m[2] ? (parseFloat(m[1]) + parseFloat(m[2])) / 2 : parseFloat(m[1])) : null;
  const sets = parseInt(sr.sets, 10);
  return {T: T > 0 ? T : null, sets: sets > 0 ? sets : null};
}
// display reps for one exercise, applying its override and (if grouped) the group's shared sets
function dispReps(dayKey, ex, groupSets){
  const base = (repsFor(dayKey)[exKey(ex.name)] || ex.reps);
  if(groupSets == null) return base;
  const r = splitSR(base).reps;
  return groupSets + "x" + r;
}

/* ============================================================
   FAILURE MATH
   strength score = weight × (1 + reps ÷ 30)            (Epley)
   weight you'd fail at with T reps = score ÷ (1 + T ÷ 30)
   rest of today's sets = 85% of that, one weight for all of them
   ============================================================ */
function epley(w, r){ return w * (1 + r / 30); }
function wAt(S, T){ return S / (1 + T / 30); }
function repsAt(S, w){ return w > 0 ? 30 * (S / w - 1) : 0; }

// real weights you can load for an exercise
const DB_WEIGHTS = (()=>{ const a = []; for(let w = 5; w <= 30; w += 2.5) a.push(w); for(let w = 35; w <= 250; w += 5) a.push(w); return a; })();
function weightList(key){
  const m = metaFor(key);
  if(m.equip === "db") return DB_WEIGHTS;
  if(m.equip === "bw"){ const a = []; for(let w = 0; w <= 300; w += 5) a.push(w); return a; }
  if(m.equip === "bar"){
    // plates are mostly 45s, 25s and 10s — that makes every 5 lbs per side from 20 up
    const bar = +m.bar || 0, step = (+m.sides === 1) ? 5 : 10, a = [];
    for(let w = bar || step; w <= bar + 1200; w += step) a.push(w);
    return a;
  }
  if(+m.step > 0){
    const st = +m.step, s0 = (+m.start > 0) ? +m.start : st, a = [];
    for(let i = 0; i <= 300; i++) a.push(Math.round((s0 + i * st) * 100) / 100);
    return a;
  }
  return null;   // a machine we haven't been told about — learn from the numbers people type
}
function learnedList(key){
  const s = new Set();
  logsFor(key).forEach(e=>{ const w = num(e.weight); if(w > 0) s.add(w); });
  return [...s].sort((a, b)=> a - b);
}
function round25(x){ return Math.round(x / 2.5) * 2.5; }
// pick a real weight for a load of x.
//   opt.base  = body weight to add on (bodyweight moves: the list is added weight, the math is total load)
//   opt.up    = set 1: round UP so you fail on or before the target — unless that next weight up
//               would cost more than 1 rep, in which case stay under and push for more reps
//   opt.max   = never above this
function pickWeight(key, x, opt){
  opt = opt || {};
  const base = +opt.base || 0;
  if(!(x > 0)) return {w: 0};
  const cap = opt.max != null ? opt.max + 1e-9 : Infinity;
  const list = weightList(key);
  if(!list){
    const learned = learnedList(key).filter(v=> v <= cap);
    let best = null;
    learned.forEach(v=>{ if(best == null || Math.abs(v - x) < Math.abs(best - x)) best = v; });
    if(opt.up && opt.S){
      const upTo = wAt(opt.S, Math.max(1, opt.T - 1));     // heaviest weight that still leaves T-1 reps
      const ups = learned.filter(v=> v >= x - 1e-9 && v <= upTo + 1e-9);
      if(ups.length) return {w: ups[0]};                   // a weight you've used that rounds up within a rep
    }
    if(best != null && Math.abs(best - x) / x <= 0.04) return {w: best};
    return {w: round25(Math.min(x, cap)), approx: true};
  }
  const L = list.filter(v=> v + base <= cap);
  if(!L.length) return {w: list[0]};
  let a = null, b = null;
  for(const v of L){ const load = v + base; if(load <= x + 1e-9) a = v; if(load >= x - 1e-9){ b = v; break; } }
  if(a == null) return {w: b};
  if(b == null) return {w: a};
  if(a === b) return {w: a};
  if(opt.up && opt.S) return repsAt(opt.S, b + base) >= opt.T - 1 ? {w: b} : {w: a};
  const fine = ((b + base) - (a + base)) / (a + base) <= 0.10;
  if(opt.smart && !fine && opt.S) return repsAt(opt.S, b + base) >= opt.T - 2 ? {w: b} : {w: a};
  return (x - (a + base)) <= ((b + base) - x) ? {w: a} : {w: b};
}
// body weight, entered once per person, so pull-ups and dips can use the real math
function bwOf(p){ const v = num(((STATE.settings || {}).bw || {})[p]); return v > 0 ? v : 0; }
// weight for the rest of today's sets after set 1 (W × R) — one weight for all of them
function backoffFor(ex, W, R, T, p){
  const key = exKey(ex.name), m = metaFor(key), bw = (m.equip === "bw" && p) ? bwOf(p) : 0;
  if(m.equip === "bw" && !bw) return W > 0 ? pickWeight(key, W * 0.85) : {w: 0};   // body weight unknown: 85% of the added weight
  const load = W + bw;
  const ideal = 0.85 * wAt(epley(load, R), T);
  if(bw && ideal <= bw) return {w: 0, bwOnly: true};        // lighter than you weigh — drop the added weight
  return pickWeight(key, ideal, {base: bw});
}
// the reps the app expected you to get at this weight, from your last failure set
function expectedReps(ex, p, w, T, skipId){
  const key = exKey(ex.name), bw = metaFor(key).equip === "bw" ? bwOf(p) : 0;
  const fails = logsFor(key).filter(e=> e.person === p && +e.reps > 0 && e.id !== skipId);
  const prev = fails[fails.length - 1];
  if(!prev) return null;
  if(metaFor(key).equip === "bw" && !bw) return null;
  const S = epley(num(prev.weight) + bw, +prev.reps);
  const r = repsAt(S, w + bw);
  return (r > 0 && r < 200) ? Math.round(r * 10) / 10 : null;
}
const WHY = {
  start:  "First failure set: your old weight counts as your 85% weight, so this is your starting guess.",
  on:     "You got what the app expected last time, so same weight.",
  up:     "You beat what the app expected last time, so go up.",
  reps:   "The next weight up would cost you more than a rep, so same weight and go for more reps.",
  hold:   "A little short last time, so same weight once more.",
  down:   "Short of what the app expected, so a bit lighter.",
  target: "You changed the target reps, so the weight changed to match."
};
const WHY_SHORT = {start:"", on:"(same weight)", up:"(go up)", reps:"(push for more reps)", hold:"(same weight once more)", down:"(lighter)", target:""};
// next "try" weight for one person. extra = a set about to be saved (for the live preview).
function suggestFor(ex, p, T, extra){
  const key = exKey(ex.name), m = metaFor(key);
  let entries = logsFor(key).filter(e=> e.person === p);
  if(extra) entries = entries.concat([extra]);
  const fails = entries.filter(e=> +e.reps > 0 && num(e.weight) >= 0);
  const last = fails[fails.length - 1];
  if(!last){
    // first time: treat the last weight you logged as your 85% weight
    const lastAny = entries[entries.length - 1];
    let base = lastAny ? num(lastAny.weight) : NaN;
    if(!(base >= 0) && m.equip !== "bw") base = num(parsePlan(ex.note).people[p]);
    if(!(base >= 0)) return null;
    if(m.equip === "bw") return {w: base, why: "start"};
    if(!(base > 0)) return null;
    return Object.assign(pickWeight(key, base / 0.85), {why: "start"});
  }
  const W = num(last.weight), R = +last.reps, tgt = +last.tgt || T;
  const bw = m.equip === "bw" ? bwOf(p) : 0;
  // judge against what the app expected at that weight, not the plan's target —
  // with big jumps (light dumbbells, pull-ups) the two aren't the same
  const aimed = (+last.exp > 0 && Math.abs(tgt - T) < 0.01) ? +last.exp : tgt;
  const diff = R - aimed;
  const prev = fails[fails.length - 2];
  const prevShort = !!prev && (+prev.reps <= (+prev.exp > 0 ? +prev.exp : (+prev.tgt || T)) - 2) && Math.abs(num(prev.weight) - W) < 0.01;
  if(m.equip === "bw" && !bw){   // body weight unknown: simple steps of 5
    if(diff >= 2) return {w: W + 5, why: "up"};
    if(diff <= -4 || (diff <= -2 && prevShort)) return {w: Math.max(0, W - 5), why: "down"};
    return {w: W, why: diff <= -2 ? "hold" : "on"};
  }
  const S = epley(W + bw, R), ideal = wAt(S, T);
  const pick = extraOpt => pickWeight(key, ideal, Object.assign({up: true, S, T, base: bw}, extraOpt || {}));
  if(Math.abs(tgt - T) > 0.01) return Object.assign(pick(), {why: "target", S, bw});
  if(diff > -2 && diff < 2) return {w: W, why: "on", S, bw};
  if(diff >= 2){
    const s = pick();
    if(!(s.w > W + 1e-9)) return {w: W, why: "reps", S, bw};
    return Object.assign(s, {why: "up", S, bw});
  }
  if(diff > -4 && !prevShort) return {w: W, why: "hold", S, bw};
  return Object.assign(pick({max: W + bw}), {why: "down", S, bw});
}
// how to load a barbell: "bar + 25 + 10 each side" (uses 45s, 25s and 10s before any 5s)
function platesFor(p){
  let best = null, bestScore = Infinity;
  for(let a = 0; a * 45 <= p + 1e-9; a++)
    for(let b = 0; a*45 + b*25 <= p + 1e-9; b++)
      for(let c = 0; a*45 + b*25 + c*10 <= p + 1e-9; c++){
        let r = p - a*45 - b*25 - c*10;
        const f = Math.floor(r / 5 + 1e-9); r -= f * 5;
        const h = Math.round(r / 2.5);
        if(Math.abs(r - h * 2.5) > 1e-6) continue;
        const score = (f + h) * 100 + a + b + c + f + h;
        if(score < bestScore){ bestScore = score; best = [[45,a],[25,b],[10,c],[5,f],[2.5,h]]; }
      }
  return best && best.filter(x=> x[1] > 0).map(([pl, n])=> n > 1 ? n + "×" + pl : String(pl)).join(" + ");
}
function plateText(key, w){
  const m = metaFor(key);
  if(m.equip !== "bar" || !(w > 0)) return "";
  const bar = +m.bar || 0, sides = +m.sides === 1 ? 1 : 2, per = (w - bar) / sides;
  if(per < 0) return "";
  if(per === 0) return bar ? "just the bar" : "";
  const txt = platesFor(per);
  return txt ? (bar ? "bar + " : "") + txt + (sides === 2 ? " each side" : "") : "";
}
function fmtLoad(w, isBW){ return (isBW && !(w > 0)) ? "bodyweight" : fmtNum(w); }

/* ---------- one person's boxes on a failure exercise ----------
   [weight] × [reps] for set 1 — the grey numbers are what the math says from last time.
   The line under it is the weight for the rest of the sets, worked out from set 1. */
function failCell(ex, p, tgt, repsLabel, cell){
  const key = exKey(ex.name), isBW = metaFor(key).equip === "bw";
  let today = logsFor(key).filter(e=> e.person === p && +e.reps > 0 && isToday(e.ts)).pop() || null;
  const sug = today ? null : suggestFor(ex, p, tgt.T);
  const range = /^\d+\s*[–-]\s*\d+/.exec(splitSR(repsLabel).reps);
  const loadTxt = w=> (isBW && !(w > 0)) ? "BW" : fmtNum(w);
  cell.innerHTML =
    `<label class="plab tap ${p}">${PEOPLE[p]}</label>
     <div class="fpair">
       <input class="wbox fw" inputmode="decimal" aria-label="${PEOPLE[p]} set 1 weight"
         value="${today ? esc(loadTxt(num(today.weight))) : ""}" placeholder="${sug ? (sug.approx ? "~" : "") + loadTxt(sug.w) : "lbs"}">
       <span class="fx">×</span>
       <input class="wbox fr" inputmode="numeric" aria-label="${PEOPLE[p]} set 1 reps"
         value="${today ? today.reps : ""}" placeholder="${range ? range[0].replace(/\s/g, "") : fmtNum(tgt.T)}">
     </div>
     <div class="wsub"></div>`;
  const wI = cell.querySelector(".fw"), rI = cell.querySelector(".fr"), sub = cell.querySelector(".wsub");
  cell.querySelector(".plab").onclick = ()=> openFailPop(ex, p, tgt, repsLabel);   // details: last time, why, plates
  const typedW = ()=>{ const t = wI.value.trim(); return t === "" ? null : (/^bw$/i.test(t) ? 0 : num(t)); };
  // rest of the sets: from what you did on set 1, or (before you do it) from the grey numbers.
  // Their reps stay at the target — only the weight changes.
  const restReps = metaFor(key).rule === "failall" ? "max" : (range ? range[0].replace(/\s/g, "") : fmtNum(tgt.T));
  function restLine(){
    const tw = typedW(), rt = rI.value.trim();
    const w = tw != null ? tw : (sug ? sug.w : NaN);
    const r = rt !== "" ? parseInt(rt, 10) : tgt.T;
    const n = tgt.sets ? tgt.sets - 1 : 0;
    const real = rt !== "";
    if(n < 1 || !(r > 0)){ sub.textContent = ""; sub.className = "wsub"; return; }
    if(!(w >= 0)){   // nobody has logged a weight here yet
      sub.textContent = real ? "enter your weight" : "";
      sub.className = "wsub" + (real ? " need" : "");
      return;
    }
    const b = backoffFor(ex, w, r, tgt.T, p);
    const guessW = tw == null && sug && sug.approx;   // still waiting for the real weight on a machine
    sub.textContent = n + " more: " + ((b.approx || guessW) ? "~" : "") + loadTxt(b.w) + " × " + restReps;
    sub.className = "wsub" + (real && !guessW ? " then" : "");
  }
  // saves once set 1 has reps; editing it again later today just updates the same entry
  function save(){
    const rt = rI.value.trim();
    if(rt === ""){
      if(today){ write("logs/" + key + "/" + today.id, null); today = null; }
      restLine(); return;
    }
    const r = parseInt(rt, 10);
    if(!(r > 0 && r < 200)) return;
    let w = typedW();
    if(w == null){
      if(sug && !sug.approx) w = sug.w;
      else { wI.classList.add("need"); restLine(); return; }    // a machine the app doesn't know yet — type the weight you used
    }
    if(!(w >= 0)) return;
    holdRenders();
    const id = today ? today.id : newLogId(key);
    const entry = {person: p, weight: fmtNum(w), reps: r, tgt: tgt.T, ts: today ? today.ts : Date.now()};
    const exp = expectedReps(ex, p, w, tgt.T, id);   // what the app expected at this weight
    if(exp != null) entry.exp = exp;
    write("logs/" + key + "/" + id, entry);
    today = Object.assign({id}, entry);
    if(wI.value.trim() === "") wI.value = loadTxt(w);
    [wI, rI].forEach(i=>{ i.classList.remove("need"); i.classList.add("okflash"); setTimeout(()=> i.classList.remove("okflash"), 700); });
    restLine();
  }
  wI.oninput = restLine; rI.oninput = restLine;
  wI.onchange = save; rI.onchange = save;
  [wI, rI].forEach(i=> i.onfocus = ()=> setTimeout(()=> i.select(), 0));   // typing replaces the old number
  restLine();
}

/* ---------- render a single exercise card ---------- */
function exerciseCard(ex, opts){
  opts = opts || {};
  const key = exKey(ex.name);
  const store = logsFor(key);
  const plan = parsePlan(ex.note);
  const m = metaFor(key);
  const tgt = targetOf(opts.reps || ex.reps);
  const failMode = failureOn() && m.rule !== "none" && tgt.T != null;
  // most recent logged weight for a person (falls back to the plan weight)
  const lastOf = (p)=>{ for(let i=store.length-1;i>=0;i--){ if(store[i].person===p) return store[i].weight; } return null; };

  const card = document.createElement("div");
  card.className = "card" + (editMode && selSet.has(key) ? " sel" : "") + (opts.done ? " done" : "");

  // title row: [＋ / number] + name(opens image) + reps(editable) + failure rule + done
  const trow = document.createElement("div");
  trow.className = "trow";
  if(editMode){
    const chk = document.createElement("div");
    chk.className = "sscheck-inline" + (selSet.has(key)?" on":"");
    chk.textContent = selSet.has(key) ? "✓" : "+";
    trow.appendChild(chk);
  } else if(opts.orderSel){
    trow.appendChild(opts.orderSel);
  }
  const title = document.createElement("button");
  title.className = "extitle";
  title.innerHTML = `<span class="tnm">${ex.name}</span><span class="exicon">🖼</span>`;
  title.onclick = ()=>{
    if(editMode){ selSet.has(key) ? selSet.delete(key) : selSet.add(key); render(); }
    else openImg(ex);
  };
  trow.appendChild(title);
  if(opts.showReps){
    const rp = document.createElement("button");
    rp.className = "repsedit";
    rp.textContent = (opts.reps || ex.reps);
    rp.onclick = (e)=>{ e.stopPropagation(); if(opts.onEditReps) opts.onEditReps(); };
    trow.appendChild(rp);
  }
  if(!editMode){
    const rb = document.createElement("button");
    rb.className = "rulebtn " + m.rule + (failureOn() ? "" : " off");
    rb.textContent = RULES[m.rule].icon;
    rb.title = RULES[m.rule].label;
    rb.onclick = (e)=>{ e.stopPropagation(); openSettings(ex); };
    trow.appendChild(rb);
  }
  if(opts.onToggleDone && !editMode){
    const dn = document.createElement("button");
    dn.className = "donebtn" + (opts.done ? " on" : "");
    dn.textContent = opts.done ? "✓" : "";
    dn.onclick = (e)=>{ e.stopPropagation(); opts.onToggleDone(); };
    trow.appendChild(dn);
  }
  card.appendChild(trow);

  // 3 weight boxes side by side with colored name labels
  const boxes = document.createElement("div");
  boxes.className = "boxes";
  PORDER.forEach(p=>{
    const cell = document.createElement("div");
    cell.className = "cell " + p;
    if(failMode){
      failCell(ex, p, tgt, opts.reps || ex.reps, cell);
    } else {
      const val = lastOf(p) != null ? lastOf(p) : (plan.people[p] || "");
      cell.innerHTML =
        `<label class="plab ${p}">${PEOPLE[p]}</label>
         <input class="wbox" inputmode="decimal" data-person="${p}" value="${esc(fmtW(val))}" placeholder="—">`;
    }
    boxes.appendChild(cell);
  });
  boxes.querySelectorAll("input.wbox[data-person]").forEach(inp=>{
    // strip " lbs" while editing, and select it so typing replaces the old number
    inp.onfocus = ()=>{ inp.value = inp.value.replace(/\s*lbs\s*$/i, ""); setTimeout(()=> inp.select(), 0); };
    // on save: store the plain number, then show it with "lbs"
    inp.onchange = ()=>{
      const weight = inp.value.trim().replace(/\s*lbs\s*$/i, "");
      if(!weight) return;
      holdRenders();
      pushLog(key, {person: inp.dataset.person, weight, ts: Date.now()});
      inp.value = fmtW(weight);
      inp.classList.add("okflash");
      setTimeout(()=>inp.classList.remove("okflash"), 700);
    };
  });
  card.appendChild(boxes);

  return card;
}

// log set 1 on a failure exercise: weight + reps, and see the rest of today's sets
function openFailPop(ex, p, tgt, repsLabel){
  const key = exKey(ex.name), m = metaFor(key), rule = RULES[m.rule], T = tgt.T, sets = tgt.sets;
  const isBW = m.equip === "bw";
  const entries = logsFor(key).filter(e=> e.person === p);
  const lastAny = entries[entries.length - 1];
  const lastFail = entries.slice().reverse().find(e=> +e.reps > 0);
  const todays = entries.filter(e=> isToday(e.ts));
  const sug = suggestFor(ex, p, T);
  let info = "";
  if(lastFail) info += `Last set to failure: <b>${fmtLoad(num(lastFail.weight), isBW)} × ${lastFail.reps}</b> · ${fmtDate(lastFail.ts)}<br>`;
  else if(lastAny) info += `Last weight: <b>${esc(fmtW(lastAny.weight))}</b> · ${fmtDate(lastAny.ts)}<br>`;
  if(sug){
    const exp = (sug.S && sug.w > 0 && !isBW) ? repsAt(sug.S, sug.w) : null;
    const expTxt = (exp != null && Math.abs(exp - T) >= 1.5) ? ` · expect about ${Math.round(exp)} reps` : "";
    const plate = plateText(key, sug.w);
    info += `Try <b>${sug.approx ? "~" : ""}${fmtLoad(sug.w, isBW)}</b>${plate ? ` <span class="why">(${plate})</span>` : ""}${expTxt}` +
            `<div class="why">${WHY[sug.why] || ""}${sug.approx ? " Pick the closest weight the machine has." : ""}</div>`;
  }
  const startW = sug ? fmtNum(sug.w) : (lastAny ? fmtNum(num(lastAny.weight)) : "");
  const pop = openPop(`
    <button class="modal-x" aria-label="Close">✕</button>
    <div class="modal-title">${PEOPLE[p]} · ${esc(ex.name)}</div>
    <div class="pop-rule">${rule.icon} ${rule.label} · target ${esc(repsLabel)}</div>
    <div class="pop-info">${info}</div>
    <div class="pop-fields">
      <label>${isBW ? "Added weight" : "Weight"}<input id="pw" inputmode="decimal" value="${esc(startW === "NaN" ? "" : startW)}"></label>
      <label>Reps to failure<input id="pr" inputmode="numeric" placeholder="reps"></label>
    </div>
    <div class="pop-preview" id="pp"></div>
    <div class="pop-btns"><button class="choice-cancel" id="pc">Cancel</button><button class="pop-save" id="ps">Save</button></div>
    ${todays.length ? `<button class="pop-undo" id="pu">Undo today's entry</button>` : ""}`);
  const pw = pop.q("#pw"), pr = pop.q("#pr"), pp = pop.q("#pp");
  function upd(){
    const w = num(pw.value), r = parseInt(pr.value, 10);
    if(pw.value.trim() === "" || !(w >= 0) || !(r > 0)){
      pp.innerHTML = `<span class="why">Enter your weight and reps to see the rest of your sets.</span>`;
      return;
    }
    const b = backoffFor(ex, w, r, T, p), n = sets ? sets - 1 : 0, bPlate = plateText(key, b.w);
    const nx = suggestFor(ex, p, T, {person: p, weight: String(w), reps: r, tgt: T, ts: Date.now()});
    const restReps = m.rule === "failall" ? "to failure" : esc(splitSR(repsLabel).reps.replace(/\s*\/.*$/, "")) + " reps";
    pp.innerHTML = (n > 0 ? `Next ${n === 1 ? "set" : n + " sets"}: ` : "Rest of your sets: ") +
      `<b>${b.approx ? "~" : ""}${fmtLoad(b.w, isBW)} × ${restReps}</b>${bPlate ? ` <span class="why">(${bPlate})</span>` : ""}` +
      (nx ? `<br>Next time: <b>${nx.approx ? "~" : ""}${fmtLoad(nx.w, isBW)}</b> <span class="why">${WHY_SHORT[nx.why] || ""}</span>` : "");
  }
  pw.oninput = upd; pr.oninput = upd; upd();
  pop.q("#pc").onclick = pop.close;
  pop.q("#ps").onclick = ()=>{
    const raw = pw.value.trim().replace(/\s*lbs\s*$/i, "");
    const w = num(raw);
    if(raw === "" || !(w >= 0)){ pw.focus(); return; }
    const r = parseInt(pr.value, 10);
    const entry = {person: p, weight: fmtNum(w), ts: Date.now()};
    if(r > 0 && r < 200){ entry.reps = r; entry.tgt = T; }
    const todayFail = entry.reps ? todays.filter(e=> +e.reps > 0).pop() : null;   // fixing today's set 1 → update it, don't add another
    if(entry.reps){ const exp = expectedReps(ex, p, w, T, todayFail && todayFail.id); if(exp != null) entry.exp = exp; }
    if(todayFail){ entry.ts = todayFail.ts; write("logs/" + key + "/" + todayFail.id, entry); }
    else pushLog(key, entry);
    pop.close(); render();
  };
  const pu = pop.q("#pu");
  if(pu) pu.onclick = ()=>{
    const e = todays[todays.length - 1];
    if(!confirm(`Remove ${PEOPLE[p]}'s entry from today (${fmtW(e.weight)}${e.reps ? " × " + e.reps : ""})?`)) return;
    write("logs/" + key + "/" + e.id, null);
    pop.close(); render();
  };
  pr.focus();
}
// failure rule + equipment for one exercise
function openSettings(ex){
  const key = exKey(ex.name);
  const sel = Object.assign({}, metaFor(key));
  const pop = openPop(`<button class="modal-x" aria-label="Close">✕</button><div class="modal-title">${esc(ex.name)}</div><div id="sb"></div>`, "scroll");
  const q = s=> pop.q(s);
  function grab(){   // read the number boxes into sel
    if(q("#sbar")) sel.bar = num(q("#sbar").value) || 0;
    if(q("#ssides")) sel.sides = +q("#ssides").value;
    if(q("#sstart")) sel.start = num(q("#sstart").value) || null;
    if(q("#sstep")) sel.step = num(q("#sstep").value) || null;
  }
  function draw(){
    const ruleOpts = Object.keys(RULES).map(r=>
      `<button class="opt ${sel.rule === r ? "on" : ""}" data-rule="${r}">${RULES[r].icon} ${RULES[r].label}<span>${RULES[r].help}</span></button>`).join("");
    const eqOpts = Object.keys(EQUIP).map(e=> `<option value="${e}" ${sel.equip === e ? "selected" : ""}>${EQUIP[e]}</option>`).join("");
    let extra = "";
    if(sel.equip === "bar") extra =
      `<div class="pop-fields"><label>Bar weight<input id="sbar" inputmode="decimal" value="${sel.bar != null ? sel.bar : 45}"></label>
       <label>Plates on<select id="ssides"><option value="2" ${+sel.sides !== 1 ? "selected" : ""}>Both sides</option>
       <option value="1" ${+sel.sides === 1 ? "selected" : ""}>One side</option></select></label></div>`;
    if(sel.equip === "machine") extra =
      `<div class="pop-fields"><label>Starts at<input id="sstart" inputmode="decimal" value="${sel.start || ""}" placeholder="e.g. 10"></label>
       <label>Goes up by<input id="sstep" inputmode="decimal" value="${sel.step || ""}" placeholder="e.g. 12.5"></label></div>
       <div class="pop-rule">Leave these blank and the app learns this machine's numbers from what you type.</div>`;
    if(sel.equip === "bw") extra =
      `<div class="sec">Body weight</div>
       <div class="pop-fields">${PORDER.map(pp=> `<label>${PEOPLE[pp]}<input class="sbw" data-p="${pp}" inputmode="decimal" value="${bwOf(pp) || ""}" placeholder="lbs"></label>`).join("")}</div>
       <div class="pop-rule">Entered once, used by every bodyweight exercise. Without it the app just adds or drops 5 lbs.</div>`;
    q("#sb").innerHTML =
      `<div class="sec">Failure</div><div class="opt-list">${ruleOpts}</div>
       <div class="sec">Equipment</div><div class="pop-fields one"><label><select id="seq">${eqOpts}</select></label></div>${extra}
       <div class="pop-btns"><button class="choice-cancel" id="sreset">Reset to default</button><button class="pop-save" id="ssave">Save</button></div>`;
    q("#sb").querySelectorAll("[data-rule]").forEach(b=> b.onclick = ()=>{ grab(); sel.rule = b.dataset.rule; draw(); });
    q("#seq").onchange = ()=>{ grab(); sel.equip = q("#seq").value; if(sel.equip === "bar" && sel.bar == null) sel.bar = 45; draw(); };
    q("#ssave").onclick = ()=>{
      grab();
      q("#sb").querySelectorAll(".sbw").forEach(i=>{       // body weights are shared by every bodyweight exercise
        const v = num(i.value);
        write("settings/bw/" + i.dataset.p, v > 0 ? fmtNum(v) : null);
      });
      const out = {};
      ["rule", "equip", "bar", "sides", "start", "step"].forEach(k=>{ if(sel[k] != null && sel[k] !== "" && !(typeof sel[k] === "number" && isNaN(sel[k]))) out[k] = sel[k]; });
      write("exmeta/" + key, out); pop.close(); render();
    };
    q("#sreset").onclick = ()=>{ write("exmeta/" + key, null); pop.close(); render(); };
  }
  draw();
}

/* ---------- render main ---------- */
// don't rebuild the page under someone who is typing; catch up right after
let pendingRender = false, holdUntil = 0;
function isTyping(){ const a = document.activeElement; return !!(a && a.closest && a.closest("#main") && /^(INPUT|SELECT)$/.test(a.tagName)); }
function holdRenders(){ holdUntil = Date.now() + 1200; }
function safeRender(){
  if(isTyping() || Date.now() < holdUntil){
    if(!pendingRender){ pendingRender = true; setTimeout(retryRender, Math.max(300, holdUntil - Date.now() + 50)); }
    return;
  }
  render();
}
function retryRender(){ pendingRender = false; safeRender(); }
document.addEventListener("focusout", ()=> setTimeout(()=>{ if(pendingRender && !isTyping() && Date.now() >= holdUntil){ pendingRender = false; render(); } }, 60));

function render(nav){
  renderNav();
  document.querySelectorAll(".ssbar").forEach(b=>b.remove());
  const main = document.getElementById("main");
  main.innerHTML = "";

  const wk = DATA[state.week][state.day];
  const dayKey = state.week + "-" + state.day;
  const ssDay = SSDAY[state.day];

  const head = document.createElement("div");
  head.className = "dayhead";
  const rightBtns = editMode
    ? `<div class="ssbtns">
         <button class="ssmake" id="ssMake" ${selSet.size<2?'disabled':''}>Group${selSet.size?' '+selSet.size:''}</button>
         <button class="ssedit-btn on" id="ssEdit">Done</button>
       </div>`
    : `<div class="ssbtns">
         <button class="ssedit-btn fire ${failureOn() ? "on" : ""}" id="failToggle" title="Failure sets for every exercise">🔥 ${failureOn() ? "On" : "Off"}</button>
         <button class="ssedit-btn" id="ssEdit">🔗 Supersets</button>
       </div>`;
  head.innerHTML =
    `<div class="dayhead-row">
       <div class="dayhead-l"><div class="tag">Week ${state.week} · ${wk.tag}</div><h2>${wk.title}</h2></div>
       ${rightBtns}
     </div>`;
  main.appendChild(head);
  head.querySelector("#ssEdit").onclick = ()=>{ editMode=!editMode; selSet.clear(); render(); };
  const ft = head.querySelector("#failToggle");
  if(ft) ft.onclick = ()=>{ write("settings/failure", !failureOn()); render(); };
  const mk = head.querySelector("#ssMake");
  if(mk) mk.onclick = ()=>{
    const keys = [...selSet].filter(k=> wk.ex.some(e=> exKey(e.name) === k));
    if(keys.length < 2) return;
    // anything already in a superset gets moved — but ask first. The new superset also shows
    // in the other week when all its exercises are there, so check that week too.
    const conflicts = [];
    [state.week, state.week === 1 ? 2 : 1].forEach(w=>{
      if(!keys.every(k=> DATA[w][state.day].ex.some(e=> exKey(e.name) === k))) return;
      groupsForDay(w, state.day).forEach(g=>{
        if(g.keys.some(k=> keys.includes(k)) && !conflicts.some(c=> c.id === g.id)) conflicts.push(Object.assign({w}, g));
      });
    });
    if(conflicts.length){
      const allNames = {}; [1, 2].forEach(w=> DATA[w][state.day].ex.forEach(e=> allNames[exKey(e.name)] = e.name));
      const list = conflicts.map(g=> "• " + g.keys.map(k=> allNames[k] || k).join(" + ") + (g.w !== state.week ? " (Week " + g.w + ")" : "")).join("\n");
      if(!confirm("Some of these are already in a superset:\n\n" + list + "\n\nMove them into the new superset?")) return;
    }
    const rov = repsFor(dayKey);
    const chosen = wk.ex.filter(e=>keys.includes(exKey(e.name)));
    const setsOf = e => splitSR(rov[exKey(e.name)] || e.reps).sets;
    const finish = (sets)=>{
      if(sets == null) return;                        // cancelled → don't group
      conflicts.forEach(g=>{
        const rest = g.keys.filter(k=> !keys.includes(k));
        if(rest.length >= 2) write("ss2/" + ssDay + "/" + g.id + "/keys", rest);
        else write("ss2/" + ssDay + "/" + g.id, null);
      });
      const group = {keys, t: Date.now()};
      if(sets) group.sets = sets;
      write("ss2/" + ssDay + "/g" + Date.now().toString(36) + Math.floor(Math.random()*1e4), group);
      selSet.clear(); render();
    };
    // the group shares one SETS count (reps stay per-exercise); if they differ, ask
    const distinct = [...new Set(chosen.map(setsOf))];
    if(distinct.length <= 1){ finish(distinct[0]); return; }
    const choices = distinct.map(s=>({
      value: s,
      label: `<b>${s} sets</b><span class="choice-sub">${chosen.filter(e=>setsOf(e)===s).map(e=>e.name).join(", ")}</span>`
    }));
    choiceDialog("How many sets for this superset?", choices, finish);
  };

  // ---- build ordered items: each ungrouped exercise or superset = one item ----
  const groups = groupsForDay(state.week, state.day);
  const groupOf = {};
  groups.forEach(g=> g.keys.forEach(k=> groupOf[k]=g.id));
  const idxOf = {}; wk.ex.forEach((e,i)=> idxOf[exKey(e.name)] = i);
  const repsOv = repsFor(dayKey);
  const doneMap = doneToday();

  const items = [];
  const seenG = {};
  wk.ex.forEach(ex=>{
    const k = exKey(ex.name);
    const gid = groupOf[k];
    if(gid){
      if(seenG[gid]) return;
      seenG[gid] = true;
      const g = groups.find(x=>x.id===gid);
      const members = wk.ex.filter(e=>g.keys.includes(exKey(e.name)));
      const pos = Math.min.apply(null, members.map(m=>idxOf[exKey(m.name)]));
      items.push({id:gid, kind:"group", g, members, pos});
    } else {
      items.push({id:k, kind:"ex", ex, pos:idxOf[k]});
    }
  });
  // apply saved custom order (anything unknown falls back to its default spot)
  const saved = orderFor(dayKey);
  const rank = {}; saved.forEach((id,i)=> rank[id]=i);
  items.sort((a,b)=>{
    const ra = (a.id in rank) ? rank[a.id] : 1e6 + a.pos;
    const rb = (b.id in rank) ? rank[b.id] : 1e6 + b.pos;
    return ra - rb;
  });
  const orderedIds = items.map(it=>it.id);
  const total = items.length;

  function orderSelect(pos){
    const sel = document.createElement("select");
    sel.className = "ordsel";
    for(let i=1;i<=total;i++){ const o=document.createElement("option"); o.value=String(i); o.textContent=String(i); if(i===pos) o.selected=true; sel.appendChild(o); }
    sel.onclick = e=> e.stopPropagation();
    sel.onchange = ()=>{
      const ids = orderedIds.slice(), from = ids.indexOf(sel._itemId);
      if(from < 0) return;
      ids.splice(from,1); ids.splice((+sel.value)-1, 0, sel._itemId);
      write("order/" + dayKey, ids); sel.blur(); render();
    };
    return sel;
  }
  // edit an ungrouped exercise's full "sets × reps"
  function editRepsFull(k, cur){
    const v = prompt("Sets × reps (blank to reset to default):", cur || "");
    if(v === null) return;
    const t = v.trim();
    write("reps/" + dayKey + "/" + k, t || null); render();
  }
  // edit just the reps of one exercise inside a superset (sets come from the group)
  function editRepsInGroup(ex){
    const k = exKey(ex.name);
    const base = repsFor(dayKey)[k] || ex.reps;
    const cur = splitSR(base).reps;
    const v = prompt("Reps for " + ex.name + " (sets are set by the superset):", cur || "");
    if(v === null) return;
    const t = v.trim();
    write("reps/" + dayKey + "/" + k, t ? splitSR(base).sets + "x" + t : null); render();
  }
  // edit the shared sets for a whole superset
  function editSetsGroup(g){
    const v = prompt("Sets for this superset (applies to all in it):", g.sets || "");
    if(v === null) return;
    write("ss2/" + ssDay + "/" + g.id + "/sets", v.trim() || null); render();
  }

  items.forEach((it, i)=>{
    const pos = i + 1;
    if(it.kind === "group"){
      const g = it.g, gdone = !!doneMap[g.id];
      const box = document.createElement("div");
      box.className = "ssgroup" + (gdone ? " done" : "");
      const label = document.createElement("div");
      label.className = "sslabel";
      if(!editMode){ const s = orderSelect(pos); s._itemId = g.id; label.appendChild(s); }
      const ttl = document.createElement("span"); ttl.className = "sslabel-txt"; ttl.textContent = "⛓ Superset";
      label.appendChild(ttl);
      const st = document.createElement("button"); st.className = "repsedit"; st.textContent = (g.sets ? g.sets+" sets" : "set sets");
      st.onclick = (e)=>{ e.stopPropagation(); editSetsGroup(g); };
      label.appendChild(st);
      if(!editMode){
        const dn = document.createElement("button"); dn.className = "donebtn" + (gdone?" on":""); dn.textContent = gdone?"✓":"";
        dn.onclick = (e)=>{ e.stopPropagation(); toggleDone(g.id); };
        label.appendChild(dn);
      }
      const ung = document.createElement("button"); ung.className = "ssungroup"; ung.textContent = "Ungroup ✕";
      ung.onclick = (e)=>{
        e.stopPropagation();
        const other = state.week === 1 ? 2 : 1;
        const inOther = g.keys.every(k=> DATA[other][state.day].ex.some(x=> exKey(x.name) === k));
        if(!confirm("Break up this superset?" + (inOther ? "\n\nIt's also in Week " + other + ", so it will be removed there too." : ""))) return;
        write("ss2/" + ssDay + "/" + g.id, null); render();
      };
      label.appendChild(ung);
      box.appendChild(label);
      it.members.forEach(m=> box.appendChild(exerciseCard(m, {
        showReps: true, reps: dispReps(dayKey, m, g.sets),
        onEditReps: ()=> editRepsInGroup(m)
      })));
      main.appendChild(box);
    } else {
      const rv = repsOv[it.id] || it.ex.reps;
      let sel = null;
      if(!editMode){ sel = orderSelect(pos); sel._itemId = it.id; }
      main.appendChild(exerciseCard(it.ex, {
        showReps: true, reps: rv, orderSel: sel,
        done: !!doneMap[it.id],
        onEditReps: ()=> editRepsFull(it.id, rv),
        onToggleDone: ()=> toggleDone(it.id)
      }));
    }
  });

  if(nav) window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- image modal ---------- */
function openImg(ex){
  document.getElementById("modalTitle").textContent = ex.name;
  const wrap = document.getElementById("modalImgWrap");
  wrap.innerHTML = "";
  if(ex.img){
    const im = document.createElement("img");
    im.alt = ex.name; im.src = encodeURI(ex.img);
    im.onerror = ()=>{ wrap.innerHTML = `<div class="modal-ph">No image yet</div>`; };
    wrap.appendChild(im);
  } else {
    wrap.innerHTML = `<div class="modal-ph">No image yet</div>`;
  }
  document.getElementById("imgModal").hidden = false;
}
function closeImg(){ document.getElementById("imgModal").hidden = true; }

/* ---------- choice dialog (one button per option) ---------- */
function choiceDialog(title, choices, onPick){
  let settled = false;
  const ov = document.createElement("div");
  ov.className = "modal";
  ov.innerHTML =
    `<div class="modal-backdrop"></div>
     <div class="modal-card choice-card">
       <div class="modal-title">${title}</div>
       <div class="choice-list"></div>
       <button class="choice-cancel">Cancel</button>
     </div>`;
  const done = (val)=>{ if(settled) return; settled = true; if(ov.parentNode) ov.parentNode.removeChild(ov); onPick(val); };
  const list = ov.querySelector(".choice-list");
  choices.forEach(c=>{
    const b = document.createElement("button");
    b.className = "choice-btn";
    b.innerHTML = c.label;
    b.onclick = ()=> done(c.value);
    list.appendChild(b);
  });
  ov.querySelector(".choice-cancel").onclick = ()=> done(null);
  ov.querySelector(".modal-backdrop").onclick = ()=> done(null);
  document.body.appendChild(ov);
}

/* ---------- init ---------- */
document.querySelectorAll("#weekToggle button").forEach(b=>{
  b.onclick = ()=>{ state.week = +b.dataset.week; selSet.clear(); render(true); };
});
document.getElementById("modalX").onclick = closeImg;
document.getElementById("modalBackdrop").onclick = closeImg;

// connect to Firebase: upload anything left over, then listen for everyone's changes
let doneRef = null, doneDate = null;
function listenDone(){
  if(!db) return;
  const d = todayStr();
  if(doneDate === d) return;
  if(doneRef) doneRef.off();
  doneDate = d;
  doneRef = db.ref("done2/" + d);
  doneRef.on("value", s=>{ STATE.done2 = {[d]: s.val() || {}}; overlayOutbox("done2"); saveCache(); safeRender(); });
}
if(FB_OK){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  OUTBOX.forEach(sendItem);
  ["logs", "ss2", "order", "reps", "exmeta", "settings"].forEach(top=>{
    db.ref(top).on("value",
      s=>{ STATE[top] = s.val() || {}; overlayOutbox(top); saveCache(); safeRender(); },
      err=>{ SYNC_ERROR = (err && err.code) || "error"; updateSync(); });
  });
  listenDone();
  db.ref(".info/connected").on("value", s=>{ CONNECTED = !!s.val(); updateSync(); });
  migrateSupersets();
}
setTimeout(updateSync, 4000);

// a new day (app left open overnight): jump to today and clear the checkmarks
function checkNewDay(){
  const before = TODAY.date;
  computeToday();
  if(TODAY.date === before) return;
  state = {week: TODAY.week, day: TODAY.day || 1};
  editMode = false; selSet.clear();
  listenDone(); render(true);
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") checkNewDay(); });
setInterval(checkNewDay, 60000);

// keep a copy of the app on the phone so it opens with no signal
if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

render();
</script>
